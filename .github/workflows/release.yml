name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
          - runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle Python whisper worker
        shell: bash
        run: bash scripts/build_whisper_sidecar.sh ${{ matrix.rust-target }}

      # Tauri treats a *present* APPLE_CERTIFICATE as “import this .p12”, even
      # when the value is empty. Missing GitHub secrets become "" — not unset —
      # so exporting them unconditionally makes `security import` fail and no
      # .dmg is produced. Only write these into GITHUB_ENV when a real cert exists.
      - name: Export Apple signing secrets
        if: startsWith(matrix.runner, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple Developer certificate — building an unsigned .app."
            exit 0
          fi
          {
            echo "ENABLE_CODE_SIGNING=true"
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<EOF"
            echo "$APPLE_CERTIFICATE_PASSWORD"
            echo "EOF"
            echo "APPLE_SIGNING_IDENTITY<<EOF"
            echo "$APPLE_SIGNING_IDENTITY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build installer and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BellaNote v__VERSION__"
          releaseBody: |
            macOS (Apple Silicon): download a `.dmg`, open it, and drag BellaNote into Applications.

            Windows: download the NSIS installer (`.exe`) and run it. WebView2 is installed if this PC does not already have it.

            Python and faster-whisper are bundled. The first audio import downloads the Whisper model into Application Support (macOS) or AppData (Windows).
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # Tauri signs the sidecar with the app entitlements. Re-sign the worker
      # with disable-library-validation only, smoke-start it, then notarize a
      # DMG built from that .app. Do not pass APPLE_ID into the Tauri step —
      # that would notarize the worker before this fix.
      # Re-import the .p12: Tauri deletes its ephemeral keychain when the
      # build step ends, so codesign in macos_resign_sidecar.sh would otherwise
      # fail with "no identity found".
      - name: Re-sign sidecar, smoke, notarize DMG
        if: startsWith(matrix.runner, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/macos_release_finalize.sh ${{ matrix.rust-target }}
